[project]
name = "events-diary"
version = "0.1.0"
description = "Local visual intelligence system for analyzing Flightradar24 screen recordings using OCR, computer vision, and VLMs to generate structured aircraft event logs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events_diary"]
